<!DOCTYPE html>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; script-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self';">

<body>
  <header>
    <h1><i class="bi bi-mortarboard-fill" aria-hidden="true"></i> Student Portal</h1>
