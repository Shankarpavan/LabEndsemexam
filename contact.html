<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; script-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self';">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1><i class="bi bi-mortarboard-fill" aria-hidden="true"></i> Student Portal</h1>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a><a href="profile.html">Profile</a><a href="contact.html">Contact</a>
    </nav>
  </header>
  <main>
    <section class="contact">
      <h2><i class="bi bi-chat-dots" aria-hidden="true"></i> Contact Us</h2>
      <form id="contactForm">
        <label for="name">Name:</label><input type="text" id="name" required>
        <label for="email">Email:</label><input type="email" id="email" required>
        <label for="message">Message:</label><textarea id="message" rows="5" required></textarea>
        <button class="btn" type="submit">Send Message</button>
      </form>
      <p id="response" role="status" aria-live="polite"></p>
    </section>
  </main>
  <footer><p>&copy; 2026 Student Portal</p></footer>
</body>
</html>
